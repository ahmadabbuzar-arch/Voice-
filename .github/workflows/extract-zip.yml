
name: Extract AI Voice Enhancer ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-zip.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: |
          if [ ! -f ai-voice-enhancer.zip ]; then
            echo "ZIP file not found!"
            exit 1
          fi

      - name: Extract project
        run: |
          unzip -o ai-voice-enhancer.zip -d .
          rm ai-voice-enhancer.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract AI Voice Enhancer project" || echo "No changes to commit"
          git push
